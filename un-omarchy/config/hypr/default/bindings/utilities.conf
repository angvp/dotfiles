# Menus
bindd = SUPER, SPACE, Launch apps, exec, ~/.dotfiles/bin/launch-walker
bindd = SUPER CTRL, E, Emoji picker, exec, ~/.dotfiles/bin/launch-walker -m symbols
bindd = , XF86Calculator, Calculator, exec, gnome-calculator

# Aesthetics
bindd = SUPER SHIFT, SPACE, Toggle top bar, exec, ~/.dotfiles/bin/toggle-waybar

# Notifications
bindd = SUPER, COMMA, Dismiss last notification, exec, makoctl dismiss
bindd = SUPER SHIFT, COMMA, Dismiss all notifications, exec, makoctl dismiss --all
bindd = SUPER CTRL, COMMA, Toggle silencing notifications, exec, ~/.dotfiles/bin/toggle-notification-silencing
bindd = SUPER ALT, COMMA, Invoke last notification, exec, makoctl invoke
bindd = SUPER SHIFT ALT, COMMA, Restore last notification, exec, makoctl restore

# Toggles
bindd = SUPER CTRL, I, Toggle locking on idle, exec, ~/.dotfiles/bin/toggle-idle
bindd = SUPER CTRL, N, Toggle nightlight, exec, ~/.dotfiles/bin/toggle-nightlight
bindd = SUPER CTRL, Delete, Toggle laptop display, exec, ~/.dotfiles/bin/hyprland-monitor-internal toggle
bindl = , switch:on:Lid Switch, exec, ~/.dotfiles/bin/hyprland-monitor-internal off
bindl = , switch:off:Lid Switch, exec, ~/.dotfiles/bin/hyprland-monitor-internal on

# Captures
bindd = , PRINT, Screenshot, exec, ~/.dotfiles/bin/capture-screenshot
bindd = SUPER, PRINT, Color picker, exec, pkill hyprpicker || hyprpicker -a
bindd = SUPER CTRL, PRINT, Extract text (OCR) from screenshot, exec, ~/.dotfiles/bin/capture-text-extraction

# Waybar-less information
bindd = SUPER CTRL ALT, T, Show time, exec, notify-send -u low "    $(date +"%A %H:%M  ·  %d %B %Y  ·  Week %V")"
bindd = SUPER CTRL ALT, B, Show battery remaining, exec, notify-send -u low "$(~/.dotfiles/bin/battery-status)"
bindd = SUPER CTRL ALT, W, Show weather, exec, notify-send -u low "$(~/.dotfiles/bin/weather-status)"

# Control panels
bindd = SUPER CTRL, A, Audio controls, exec, ~/.dotfiles/bin/launch-tui pulsemixer
bindd = SUPER CTRL, B, Bluetooth controls, exec, ~/.dotfiles/bin/launch-tui bluetuith
bindd = SUPER CTRL, W, Wifi controls, exec, ~/.dotfiles/bin/launch-tui nmtui
bindd = SUPER CTRL, T, Activity, exec, ~/.dotfiles/bin/launch-tui btop

# Dictation
bindd = SUPER CTRL, X, Toggle dictation, exec, voxtype record toggle

bindd  = , F9, Start dictation (push-to-talk), exec, voxtype record start
binddr = , F9, Stop dictation (push-to-talk),  exec, voxtype record stop

# Zoom
bindd = SUPER CTRL, Z, Zoom in, exec, hyprctl keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '.float + 1')
bindd = SUPER CTRL ALT, Z, Reset zoom, exec, hyprctl keyword cursor:zoom_factor 1

# Lock system
bindd = SUPER CTRL, L, Lock system, exec, ~/.dotfiles/bin/system-lock
bindld = , XF86PowerOff, Power menu, exec, systemctl poweroff
